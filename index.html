<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ががあつめ">
<meta name="theme-color" content="#c9a06a">
<title>ががあつめ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fdf7ea;
  --cream-2:#f0e2c6;
  --wood:#a9713f;
  --wood-dk:#7d5029;
  --ink:#5b4632;
  --ink-2:#957f63;
  --leaf:#7ba05b;
  --berry:#e08a9b;
  --round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",
          "Rounded Mplus 1c","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:var(--round);font-weight:500;color:var(--ink);
  background:#2c2419;display:flex;justify-content:center;
  -webkit-user-select:none;user-select:none;
}

/* ── 画面の枠 ─────────────────────────── */
#app{
  position:relative;width:100%;max-width:440px;height:100%;
  overflow:hidden;background:#8fae7a;
}

/* ── 背景（時間で入れ替わる） ─────────── */
.bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:0;transition:opacity 2.5s ease;
  pointer-events:none;
}
#yard{position:absolute;inset:0;z-index:5;pointer-events:none}
.who{pointer-events:auto}
#top,#tip,#bottom{z-index:10}
@media (prefers-reduced-motion:reduce){.bg{transition:none}}

/* ── 置き場 ───────────────────────────── */
.goods,.who{position:absolute;transform-origin:bottom center}
.goods{
  transform:translate(-50%,-100%);
  font-size:34px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
}
.goods img{display:block;width:46px;height:auto;image-rendering:pixelated}
.who{transform:translate(-50%,-100%);cursor:pointer}
.who canvas{display:block;image-rendering:pixelated;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.who .dot{
  position:absolute;left:50%;top:-18px;transform:translateX(-50%);
  width:22px;height:22px;border-radius:50%;
  background:var(--cream);border:2px solid var(--wood);
  animation:pop 1.4s ease-in-out infinite;
}
.who .dot::after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:3px;height:3px;border-radius:50%;background:var(--wood);
  box-shadow:-6px 0 var(--wood),6px 0 var(--wood);
}
@keyframes pop{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.who .dot{animation:none}}

/* ── 上のバー ─────────────────────────── */
#top{
  position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;
}
.plate{
  background:rgba(253,247,234,.93);border:2px solid rgba(169,113,63,.4);
  border-radius:999px;box-shadow:0 3px 0 rgba(125,80,41,.25);
  padding:7px 15px;display:flex;align-items:center;gap:8px;
}
#title{font-weight:800;font-size:17px;letter-spacing:.04em}
#clock{font-size:12px;color:var(--ink-2)}
#coin{margin-left:auto;font-weight:800;font-size:15px;color:var(--wood-dk)}
#coin small{font-weight:500;font-size:11px;color:var(--ink-2);margin-right:2px}

/* ── 下のボタン ───────────────────────── */
#bottom{
  position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:12px;
}
.big{
  font-family:var(--round);font-weight:800;font-size:16px;color:var(--wood-dk);
  background:var(--cream);border:2px solid var(--wood);border-radius:999px;
  box-shadow:0 4px 0 var(--wood);padding:12px 30px;cursor:pointer;
  transition:transform .08s,box-shadow .08s;
}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood)}
.big:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
#tip{
  position:absolute;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));
  margin:0;text-align:center;font-size:12.5px;color:var(--ink);padding:0 20px;
  text-shadow:0 1px 0 rgba(253,247,234,.9),0 0 8px rgba(253,247,234,.95);
}

/* ── ふきだし ─────────────────────────── */
#talk{
  position:absolute;inset:0;z-index:40;display:none;
  align-items:center;justify-content:center;padding:24px;background:rgba(60,45,30,.35);
}
#talk.open{display:flex}
.balloon{
  background:var(--cream);border:3px solid var(--wood);border-radius:22px;
  box-shadow:0 6px 0 var(--wood-dk);padding:18px 20px;width:100%;max-width:330px;
  animation:bounce .26s cubic-bezier(.2,1.4,.5,1);
}
@keyframes bounce{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.balloon{animation:none}}
.balloon .who-name{font-weight:800;font-size:13px;color:var(--wood)}
.balloon .line{font-size:17px;line-height:1.8;margin-top:5px}
.balloon .got{margin-top:12px;font-size:13px;font-weight:800;color:var(--leaf)}

/* ── 下から出るパネル ─────────────────── */
.sheet{position:absolute;inset:0;z-index:30;display:none;background:rgba(60,45,30,.4)}
.sheet.open{display:flex;align-items:flex-end}
.sheet-in{
  width:100%;max-height:82%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--cream);border-top:3px solid var(--wood);border-radius:26px 26px 0 0;
  padding:20px 16px calc(24px + env(safe-area-inset-bottom));
  animation:up .24s ease-out;
}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}}
.sheet h2{font-size:18px;font-weight:800;margin:0 0 3px;color:var(--wood-dk)}
.sheet .lead{margin:0 0 14px;font-size:12.5px;color:var(--ink-2)}
.shut{
  display:block;width:100%;margin-top:18px;padding:13px;
  font-family:var(--round);font-weight:800;font-size:15px;color:var(--wood-dk);
  background:var(--cream-2);border:2px solid var(--wood);border-radius:999px;
  box-shadow:0 4px 0 var(--wood);cursor:pointer;
}
.shut:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood)}

/* ── グッズ ───────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:9px}
.thing{
  display:flex;gap:10px;align-items:center;text-align:left;
  font-family:var(--round);font-weight:500;color:var(--ink);
  background:#fff;border:2px solid var(--cream-2);border-radius:16px;
  padding:10px 11px;cursor:pointer;
}
.thing .em{font-size:26px;line-height:1}
.thing .nm{font-weight:800;font-size:14px}
.thing .sub{font-size:11px;color:var(--ink-2);line-height:1.5}
.thing.out{border-color:var(--leaf);background:#f2f8ec}
.thing.out .sub{color:var(--leaf);font-weight:800}
.thing.locked{opacity:.55}
.thing:active{transform:translateY(1px)}

/* ── 記録帳 ───────────────────────────── */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:9px}
.card{
  background:#fff;border:2px solid var(--cream-2);border-radius:16px;
  padding:9px 6px 8px;text-align:center;position:relative;
}
.card canvas{display:block;margin:0 auto;image-rendering:pixelated}
.card .nm{font-weight:800;font-size:13px;margin-top:5px}
.card .ct{font-size:10.5px;color:var(--ink-2)}
.card .gf{font-size:10.5px;color:var(--wood);margin-top:2px}
.card.new::after{
  content:"はじめまして";position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  background:var(--berry);color:#fff;font-size:9.5px;font-weight:800;
  border-radius:999px;padding:2px 8px;white-space:nowrap;
}
.card.unknown{background:var(--cream-2);border-color:var(--cream-2);color:#b6a288}
.card.unknown .q{font-size:30px;font-weight:800;line-height:70px}

/* ── 留守中 ───────────────────────────── */
.report ul{margin:0;padding:0}
.report li{
  list-style:none;display:flex;gap:10px;align-items:center;
  padding:9px 4px;border-bottom:2px dotted var(--cream-2);
}
.report .nm{font-weight:800;font-size:15px}
.report .gf{font-size:12px;color:var(--ink-2);margin-left:auto;text-align:right}
</style>
</head>
<body>

<div id="app">
  <img class="bg" id="bg-night"   src="bg/night.jpg"   alt="">
  <img class="bg" id="bg-morning" src="bg/morning.jpg" alt="">
  <img class="bg" id="bg-day"     src="bg/day.jpg"     alt="">
  <img class="bg" id="bg-evening" src="bg/evening.jpg" alt="">

  <div id="yard"></div>

  <div id="top">
    <div class="plate"><span id="title">ががあつめ</span><span id="clock"></span></div>
    <div class="plate" id="coin"><small>おもいで</small><span id="mem">0</span></div>
  </div>

  <p id="tip"></p>

  <div id="bottom">
    <button class="big" id="btn-items">おく</button>
    <button class="big" id="btn-dex">きろく</button>
  </div>

  <div class="sheet" id="sheet-items"><div class="sheet-in">
    <h2>おく</h2>
    <p class="lead">おけるのは3つまで。おすと 出したり しまったり できます。</p>
    <div class="grid" id="item-list"></div>
    <button class="shut" data-close>とじる</button>
  </div></div>

  <div class="sheet" id="sheet-dex"><div class="sheet-in">
    <h2>きろく</h2>
    <p class="lead" id="dex-lead"></p>
    <div class="dex" id="dex-list"></div>
    <button class="shut" data-close>とじる</button>
  </div></div>

  <div class="sheet" id="sheet-report"><div class="sheet-in report">
    <h2>るすの あいだに</h2>
    <p class="lead" id="report-lead"></p>
    <ul id="report-list"></ul>
    <button class="shut" data-close>うけとる</button>
  </div></div>

  <div id="talk"><div class="balloon">
    <div class="who-name" id="talk-who"></div>
    <div class="line" id="talk-line"></div>
    <div class="got" id="talk-got"></div>
  </div></div>
</div>

<script>
"use strict";

/* ══════════ 保存（使えない環境でも動く） ══════════ */
const Store = (() => {
  let mem = {}, ok = true;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); } catch(e){ ok = false; }
  return {
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ mem[k]=v; } }
  };
})();

/* ══════════ テキストの読み込み ══════════ */
function parseBlocks(text){
  const out = []; let cur = null, key = null;
  for (const raw of text.split(/\r?\n/)){
    const line = raw.trim();
    if (!line || line.startsWith("//")) continue;
    if (line.startsWith("=")){ cur = {name:line.slice(1).trim(), fields:{}}; out.push(cur); key = null; continue; }
    if (line.startsWith("#")){ key = line.replace(/^#+/,"").trim(); if (cur) cur.fields[key] = []; continue; }
    if (cur && key) cur.fields[key].push(line);
  }
  return out;
}
const one  = (b,k,d="") => (b.fields[k] && b.fields[k][0]) ?? d;
const many = (b,k) => (b.fields[k]||[]).flatMap(s => s.split(/[,、]/).map(t=>t.trim()).filter(Boolean));
async function loadText(p){
  const r = await fetch(p + "?v=" + Date.now());
  if (!r.ok) throw new Error(p);
  return r.text();
}

/* ══════════ マイクラスキン → 正面ドット絵 ══════════ */
function faces(slim){
  const a = slim ? 3 : 4;
  return {
    rleg:[[4,20,4,12],[4,36,4,12]],   lleg:[[20,52,4,12],[4,52,4,12]],
    rarm:[[44,20,a,12],[44,36,a,12]], larm:[[36,52,a,12],[52,52,a,12]],
    body:[[20,20,8,12],[20,36,8,12]], head:[[8,8,8,8],[40,8,8,8]]
  };
}
function buildSprite(img, slim, bob){
  const a = slim ? 3 : 4, W = a*2+8, H = 32;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
  const F = faces(slim), bx = a;
  const put = (p,dx,dy) => { for (const [sx,sy,sw,sh] of F[p]) g.drawImage(img,sx,sy,sw,sh,dx,dy,sw,sh); };
  put("rleg",bx,20);      put("lleg",bx+4,20);
  put("rarm",bx-a,8+bob); put("larm",bx+8,8+bob);
  put("body",bx,8+bob);   put("head",bx,0+bob);
  return c;
}
function silhouette(){
  const c = document.createElement("canvas"); c.width = 16; c.height = 32;
  const g = c.getContext("2d");
  g.fillStyle = "#6b5a48";
  g.fillRect(4,0,8,8); g.fillRect(4,8,8,12); g.fillRect(0,8,4,12);
  g.fillRect(12,8,4,12); g.fillRect(4,20,4,12); g.fillRect(8,20,4,12);
  g.fillStyle = "#8d7b66"; g.fillRect(6,3,1,1); g.fillRect(9,3,1,1);
  return c;
}
const loadImage = src => new Promise(res => {
  const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src;
});

/* ══════════ 時間帯 ══════════ */
const ANCHORS = [[0,"night"],[4.5,"night"],[6.5,"morning"],[9,"day"],
                 [16,"day"],[18,"evening"],[20,"night"],[24,"night"]];
const BG = {};
["night","morning","day","evening"].forEach(k => BG[k] = document.getElementById("bg-"+k));

function nowHour(){ const d = new Date(); return d.getHours() + d.getMinutes()/60; }
const isNight = h => (h < 6 || h >= 18.5);

function updateBackground(){
  const h = nowHour();
  let a = "night", b = "night", t = 0;
  for (let i = 0; i < ANCHORS.length-1; i++){
    const [h0,k0] = ANCHORS[i], [h1,k1] = ANCHORS[i+1];
    if (h >= h0 && h <= h1){ a = k0; b = k1; t = (h1===h0) ? 0 : (h-h0)/(h1-h0); break; }
  }
  for (const k in BG){ BG[k].style.opacity = 0; BG[k].style.zIndex = 0; }
  BG[a].style.zIndex = 1; BG[a].style.opacity = 1;
  if (b !== a){ BG[b].style.zIndex = 2; BG[b].style.opacity = t; }
}

/* ══════════ ゲームの中身 ══════════ */
// 置き場の位置（背景に対する％）。s は奥ほど小さく見せる倍率、ix はグッズの横ずれ
const SPOTS = [
  {x:21, y:80, s:1.00, ix:13},
  {x:53, y:68, s:0.90, ix:12},
  {x:80, y:59, s:0.78, ix:-11}
];
const SPRITE_H = 15;          // 画面の高さに対するキャラの大きさ（％）
const ROUND_MS = 20*60*1000;  // 20分ごとに来訪判定
const MAX_ROUNDS = 72;        // 遡るのは24時間ぶんまで
const ARRIVE_P = 0.35;
const GREET_REWARD = 3;
const GIFT_REWARD = 5;

const CHARS = new Map(), ITEMS = new Map();
let state = { memories:0, owned:[], placed:[null,null,null],
              visitors:[], dex:{}, lastSeen:Date.now(), pending:[] };

const $ = s => document.querySelector(s);
const yard = $("#yard");

async function boot(){
  let ct, it;
  try { [ct, it] = await Promise.all([loadText("characters.txt"), loadText("items.txt")]); }
  catch(e){ $("#tip").textContent = "characters.txt が よみこめません"; return; }

  for (const b of parseBlocks(it)){
    ITEMS.set(b.name, { name:b.name, price:parseInt(one(b,"値段","0"),10)||0,
      emoji:one(b,"絵文字","◻"), image:one(b,"画像",""), desc:one(b,"説明","") });
  }
  const fb = silhouette();
  for (const b of parseBlocks(ct)){
    const skin = one(b,"スキン",""), slim = one(b,"腕","") === "細";
    let frames = [fb, fb];
    if (skin){
      const im = await loadImage("skins/" + skin);
      if (im) frames = [buildSprite(im,slim,0), buildSprite(im,slim,1)];
    }
    CHARS.set(b.name, { name:b.name, likes:many(b,"好きなもの"),
      lines:b.fields["セリフ"]||["……"], linesNight:b.fields["セリフ_夜"]||null,
      gift:one(b,"おみやげ","なにか"), rare:Math.max(1,parseInt(one(b,"レア","1"),10)||1), frames });
  }

  load(); simulate(); save();
  updateBackground(); drawYard(); refreshTop();
  if (state.pending.length) showReport();

  setInterval(() => { simulate(); save(); drawYard(); refreshTop(); }, 30000);
  setInterval(updateBackground, 60000);
  setInterval(swapFrames, 420);
}

/* ── 保存 ── */
function load(){
  const raw = Store.get("gagaatsume") || Store.get("tamariba");
  if (raw){ try { Object.assign(state, JSON.parse(raw)); } catch(e){} }
  const free = [...ITEMS.values()].filter(i => i.price === 0).map(i => i.name);
  if (!state.owned.length) state.owned = free;
  if (state.placed.every(p => !p)) state.placed = [free[0]||null, free[1]||null, null];
  state.placed = state.placed.map(p => (p && ITEMS.has(p)) ? p : null);
  state.visitors = state.visitors.filter(v => CHARS.has(v.name));
}
const save = () => Store.set("gagaatsume", JSON.stringify(state));

/* ── 誰が来るか ── */
function pickVisitor(item, exclude){
  const pool = [];
  for (const c of CHARS.values()){
    if (exclude.has(c.name)) continue;
    pool.push([c, (c.likes.includes(item) ? 6 : 1) / c.rare]);
  }
  const total = pool.reduce((s,[,w]) => s+w, 0);
  if (!total) return null;
  let r = Math.random()*total;
  for (const [c,w] of pool){ r -= w; if (r <= 0) return c; }
  return pool[pool.length-1][0];
}
function depart(v){
  const c = CHARS.get(v.name);
  const d = state.dex[v.name] || (state.dex[v.name] = {count:0, gifts:0, seen:false});
  d.count++; d.gifts++;
  state.pending.push({name:v.name, gift:c.gift});
}
function simulate(){
  const now = Date.now();
  const rounds = Math.min(MAX_ROUNDS, Math.floor((now - state.lastSeen)/ROUND_MS));
  for (let r = 1; r <= rounds; r++){
    const t = state.lastSeen + r*ROUND_MS;
    state.visitors = state.visitors.filter(v => { if (v.leaveAt <= t){ depart(v); return false; } return true; });
    const here = new Set(state.visitors.map(v => v.name));
    state.placed.forEach((item,i) => {
      if (!item) return;
      if (state.visitors.some(v => v.spot === i)) return;
      if (Math.random() > ARRIVE_P) return;
      const c = pickVisitor(item, here);
      if (!c) return;
      here.add(c.name);
      state.visitors.push({ name:c.name, spot:i, greeted:false,
        leaveAt: t + (2 + Math.floor(Math.random()*5))*ROUND_MS });
    });
  }
  state.visitors = state.visitors.filter(v => { if (v.leaveAt <= now){ depart(v); return false; } return true; });
  if (rounds > 0) state.lastSeen += rounds*ROUND_MS;
  if (now - state.lastSeen > ROUND_MS*MAX_ROUNDS) state.lastSeen = now;
}

/* ── 庭を描く ── */
let frameFlip = 0;
function drawYard(){
  yard.innerHTML = "";
  SPOTS.forEach((sp,i) => {
    const item = state.placed[i];
    if (!item) return;
    const it = ITEMS.get(item);

    const g = document.createElement("div");
    g.className = "goods";
    g.style.left = (sp.x + sp.ix) + "%";
    g.style.top  = sp.y + "%";
    g.style.transform = "translate(-50%,-100%) scale(" + sp.s + ")";
    if (it.image){ const im = document.createElement("img"); im.src = it.image; im.alt = it.name; g.appendChild(im); }
    else g.textContent = it.emoji;
    yard.appendChild(g);

    const v = state.visitors.find(x => x.spot === i);
    if (!v) return;
    const c = CHARS.get(v.name);
    const w = document.createElement("div");
    w.className = "who";
    w.style.left = sp.x + "%";
    w.style.top  = sp.y + "%";
    const src = c.frames[frameFlip];
    const cc = document.createElement("canvas");
    cc.width = src.width; cc.height = src.height;
    const g2 = cc.getContext("2d"); g2.imageSmoothingEnabled = false; g2.drawImage(src,0,0);
    cc.style.height = (SPRITE_H * sp.s) + "vh";
    cc.style.width = "auto";
    w.appendChild(cc);
    if (!v.greeted){ const d = document.createElement("div"); d.className = "dot"; w.appendChild(d); }
    w._v = v;
    w.addEventListener("click", () => greet(v));
    yard.appendChild(w);
  });
}
function swapFrames(){
  frameFlip = 1 - frameFlip;
  yard.querySelectorAll(".who").forEach(w => {
    const c = CHARS.get(w._v.name);
    const src = c.frames[frameFlip], cc = w.querySelector("canvas");
    const g = cc.getContext("2d");
    g.clearRect(0,0,cc.width,cc.height); g.imageSmoothingEnabled = false; g.drawImage(src,0,0);
  });
}
function refreshTop(){
  $("#mem").textContent = state.memories;
  const d = new Date();
  $("#clock").textContent = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const n = state.visitors.length;
  $("#tip").textContent = n ? (n + "人 きています") : "だれもいません。ものを おいて とじてみてください";
}

/* ── 話しかける ── */
function greet(v){
  const c = CHARS.get(v.name);
  const pool = (isNight(nowHour()) && c.linesNight) ? c.linesNight : c.lines;
  $("#talk-who").textContent = c.name;
  $("#talk-line").textContent = pool[Math.floor(Math.random()*pool.length)];
  const d = state.dex[v.name] || (state.dex[v.name] = {count:0, gifts:0, seen:false});
  if (!v.greeted){
    v.greeted = true; state.memories += GREET_REWARD;
    if (!d.seen){ d.seen = true; d.fresh = true; }
    $("#talk-got").textContent = "おもいで +" + GREET_REWARD;
    save(); drawYard(); refreshTop();
  } else $("#talk-got").textContent = "";
  $("#talk").classList.add("open");
}
$("#talk").addEventListener("click", () => $("#talk").classList.remove("open"));

/* ── 留守中の報告 ── */
function showReport(){
  const list = $("#report-list"); list.innerHTML = "";
  let gain = 0;
  for (const p of state.pending){
    gain += GIFT_REWARD;
    const li = document.createElement("li");
    li.innerHTML = '<span class="nm"></span><span class="gf"></span>';
    li.querySelector(".nm").textContent = p.name;
    li.querySelector(".gf").textContent = p.gift + " を おいていった";
    list.appendChild(li);
  }
  $("#report-lead").textContent = state.pending.length + "人が きて、かえっていきました。";
  state.memories += gain; state.pending = [];
  save(); refreshTop();
  $("#sheet-report").classList.add("open");
}

/* ── グッズ ── */
function renderItems(){
  const wrap = $("#item-list"); wrap.innerHTML = "";
  for (const it of ITEMS.values()){
    const owned = state.owned.includes(it.name);
    const out = state.placed.includes(it.name);
    const b = document.createElement("button");
    b.className = "thing" + (out ? " out" : "") + (owned ? "" : " locked");
    b.innerHTML = '<span class="em"></span><span><span class="nm"></span><br><span class="sub"></span></span>';
    b.querySelector(".em").textContent = it.emoji;
    b.querySelector(".nm").textContent = it.name;
    b.querySelector(".sub").textContent = !owned ? ("おもいで " + it.price + " でかう")
                                                 : (out ? "だしている" : it.desc);
    b.addEventListener("click", () => toggleItem(it, owned, out));
    wrap.appendChild(b);
  }
}
function toggleItem(it, owned, out){
  if (!owned){
    if (state.memories < it.price){ flash("おもいでが たりません"); return; }
    state.memories -= it.price; state.owned.push(it.name);
  } else if (out){
    state.placed = state.placed.map(p => p === it.name ? null : p);
    state.visitors = state.visitors.filter(v => state.placed[v.spot]);
  } else {
    const i = state.placed.indexOf(null);
    if (i < 0){ flash("おけるのは 3つまでです"); return; }
    state.placed[i] = it.name;
  }
  save(); renderItems(); drawYard(); refreshTop();
}
function flash(msg){ $("#tip").textContent = msg; setTimeout(refreshTop, 1800); }

/* ── 記録帳 ── */
function renderDex(){
  const wrap = $("#dex-list"); wrap.innerHTML = ""; let met = 0;
  for (const c of CHARS.values()){
    const d = state.dex[c.name];
    const card = document.createElement("div");
    if (d && d.seen){
      met++;
      card.className = "card" + (d.fresh ? " new" : "");
      const cc = document.createElement("canvas");
      cc.width = c.frames[0].width*2; cc.height = 64;
      const g = cc.getContext("2d"); g.imageSmoothingEnabled = false;
      g.drawImage(c.frames[0], 0, 0, cc.width, cc.height);
      card.appendChild(cc);
      const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = c.name;
      const ct = document.createElement("div"); ct.className = "ct"; ct.textContent = (d.count||0) + " かい";
      const gf = document.createElement("div"); gf.className = "gf"; gf.textContent = c.gift;
      card.append(nm, ct, gf);
      d.fresh = false;
    } else {
      card.className = "card unknown";
      card.innerHTML = '<div class="q">？</div><div class="nm">- - -</div>';
    }
    wrap.appendChild(card);
  }
  $("#dex-lead").textContent = met + " / " + CHARS.size + " 人に あいました";
  save();
}

/* ── パネル ── */
$("#btn-items").addEventListener("click", () => { renderItems(); $("#sheet-items").classList.add("open"); });
$("#btn-dex").addEventListener("click", () => { renderDex(); $("#sheet-dex").classList.add("open"); });
document.querySelectorAll("[data-close]").forEach(b =>
  b.addEventListener("click", () => b.closest(".sheet").classList.remove("open")));
document.querySelectorAll(".sheet").forEach(s =>
  s.addEventListener("click", e => { if (e.target === s) s.classList.remove("open"); }));

boot();
</script>
</body>
</html>
